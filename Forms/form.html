<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color:rgb(211, 126, 211);">
    <form action="success.html">
    <h1 align="center"> Registration form</h1>
    <label for="fn">First Name:</label>
    <input id="fn">
    <br>
    <label for="ln">Last Name:</label>
    <input id="ln">
    <br>
    <label for="dob">Date Of Birth:</label>
    <input id="dob" type="date">
    <br>
    <label for="u">User:</label>
    <input id="u">
    <br>
    <label for="p">Password:</label>
    <input id="p" type="password">
    <br>
    <label>Gender:</label><br>
    <input type="radio" id="fm">
    <label for="fm">male</label>
    <br>
    <input type="radio" id="ff">
    <label for="ff">female</label>
    <br>
    <label for="dep">Department:</label>
    <input id="dep">
    <br>
    <label>Biography:</label><br>
    <textarea rows="20" cols="20" placeholder="Enter your biography"></textarea><br>
<button type="submit">submit</button>
<button type="reset">reset</button>
    </form>
</body>
</html>
