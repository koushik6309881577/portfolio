<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>form elements</h1>
    <form>
        <label for="username">username:</label>
        <input type="password" id="username" name="username" maxlength="7" readonly  size="200px" placeholder="Enter username" required>
        <hr>
        <label>Gender</label><br>
        <input type="radio" id="formale" value="male">
        <label for="formale">male</label><br>
        <input type="radio" id="forfemale" value="female">
        <label for="forfemale">female</label>
        <hr>
        <label>Programming Language</label><br>
        <input type="checkbox" id="c" value="c">
        <label for="c">c</label><br>
        <input type="checkbox" id="python" value="python">
        <label for="python">python</label>
    </form>
</body>
</html>
