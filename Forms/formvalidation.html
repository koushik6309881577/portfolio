<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h1>Fill Details</h1>
        <br>
        <label for="u">Enter url</label>
        <input id="u" type="url" >
        <label for="d">Enter date</label>
        <input id="d" type="date" >
        <label for="n">Enter Number</label>
        <input id="n" type="number" min="18" max="27">
        <label for="em">Enter Email</label>
        <input id="em" type="email">
        <label for="user">username</label>
        <input id="user" type="text">
        <br>
        <label for="pas">password</label>
        <input id="pas" type="password" required>
        <br>
        <br>
        <button >submit</button>
        <button type="reset" >reset</button>

    </form>
</body>
</html>
